[package]
name = "spike-tauri-shell"
version = "0.1.0"
description = "Experimental Tauri shell spike for bb desktop wrapper comparison"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# Match a realistic shipping configuration: optimized, thin LTO.
lto = "thin"
codegen-units = 16
